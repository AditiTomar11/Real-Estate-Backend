spring.application.name=realestate-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bhoomi_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

app.jwt.secret=${JWT_SECRET:local-only-dev-secret-change-this-safely-123456789}
app.jwt.expiration-ms=86400000

# Comma-separated origin list (or origin *patterns* — "*" wildcard is allowed).
# The localhost patterns cover any dev port (5173, 4173, 3000, ...) and 127.0.0.1;
# an origin that is not in this list fails the CORS preflight with a 403.
# When overriding APP_CORS_ALLOWED_ORIGINS in deployment, list every origin that
# serves the frontend (e.g. https://bhoomi-realestate.vercel.app,https://*.vercel.app).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173, http://localhost:*, http://127.0.0.1:*, https://bhoomi-realestate.vercel.app, https://*.vercel.app}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:your-email@gmail.com}